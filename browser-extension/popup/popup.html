<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="popup.css" />
    <title>CyberShield Guardian</title>
  </head>
  <body>
    <header class="header">
      <img src="../icons/icon48.png" alt="" class="logo" />
      <div>
        <div class="title">CyberShield Guardian</div>
        <div class="subtitle">Real-time protection</div>
      </div>
      <label class="toggle" title="Real-time protection">
        <input type="checkbox" id="protection-toggle" />
        <span class="slider"></span>
      </label>
    </header>

    <main class="main">
      <div class="site-row">
        <span class="site-label">Current website</span>
        <span class="site-host" id="site-host">—</span>
      </div>

      <!-- Status card (safe / malicious / loading) -->
      <section class="status-card" id="status-card">
        <div class="status-loading" id="status-loading">
          <div class="spinner"></div>
          <span>Analyzing this website…</span>
        </div>

        <div class="status-body" id="status-body" hidden>
          <div class="status-head">
            <span class="status-badge" id="status-badge">—</span>
            <span class="status-score" id="status-score">—</span>
          </div>
          <div class="metrics">
            <div class="metric"><span class="metric-label">Prediction</span><span class="metric-value" id="m-prediction">—</span></div>
            <div class="metric"><span class="metric-label">Confidence</span><span class="metric-value" id="m-confidence">—</span></div>
            <div class="metric"><span class="metric-label">Threat Level</span><span class="metric-value" id="m-level">—</span></div>
          </div>
          <div class="explain-label">AI Explanation</div>
          <p class="explain" id="explain">—</p>
        </div>

        <div class="status-error" id="status-error" hidden></div>
      </section>

      <div class="actions">
        <button class="btn btn-primary" id="btn-analyze">Analyze Again</button>
        <button class="btn btn-report" id="btn-report">Report Website</button>
        <button class="btn btn-ghost" id="btn-dashboard">Open Citizen Dashboard</button>
      </div>
      <p class="report-note" id="report-note" hidden></p>

      <!-- Local history -->
      <section class="history">
        <div class="history-head">
          <span>Recent checks</span>
          <button class="link-btn" id="btn-clear">Clear</button>
        </div>
        <ul class="history-list" id="history-list"></ul>
        <p class="history-empty" id="history-empty" hidden>No websites checked yet.</p>
      </section>
    </main>

    <footer class="footer">History stays on this device • No passwords stored</footer>

    <script type="module" src="popup.js"></script>
  </body>
</html>
